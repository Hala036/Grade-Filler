# Builds GradeFiller.exe on a Windows machine.
#
#   * Actions tab → "Build Windows app" → "Run workflow": a test build; download
#     it from the run's page under "Artifacts".
#   * Every pull request into main: the same test build, as a check that the
#     .exe still packs and starts before merging.
#   * Push a version tag (git tag v1.0.0 && git push origin v1.0.0): the same
#     build, attached to a GitHub Release. The newest one is always at
#     https://github.com/Hala036/Grade-Filler/releases/latest/download/GradeFiller.exe
name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the Release on tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          echo "number=$v" >> "$GITHUB_OUTPUT"

      - name: Pack GradeFiller.exe
        run: >
          flet pack main.py -y
          --name GradeFiller
          --icon assets/icon.ico
          --add-data "assets/icon.ico:assets"
          --product-name "Grade Filler"
          --file-description "Grade Filler"
          --product-version "${{ steps.version.outputs.number }}"
          --file-version "${{ steps.version.outputs.number }}.0"
          --copyright "Grade Filler"

      # Runs the packed .exe without opening the app: loads everything, starts
      # Playwright from inside the bundle and opens Edge without a window.
      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GradeFiller.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }
          if (-not (Select-String -Path selftest.txt -Pattern "msedge: ok" -Quiet)) { throw "Edge didn't start" }

      - uses: actions/upload-artifact@v4
        with:
          name: GradeFiller-${{ steps.version.outputs.number }}
          path: dist/GradeFiller.exe

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GradeFiller.exe
          generate_release_notes: true
